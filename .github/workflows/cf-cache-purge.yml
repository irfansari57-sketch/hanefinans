name: CF Cache Purge on Deploy

# Her push sonrası CF edge cache'ini güvenilir şekilde purge eder.
# CF Pages API polling ile deploy live olunca purge çalışır.
#
# Setup:
#   Secrets: CF_API_TOKEN, CF_ACCOUNT_ID, CF_PAGES_PROJECT,
#            CF_ZONE_ID_INVESTLIQ, CF_ZONE_ID_HANEFINANS
#   CF_API_TOKEN permissions:
#     - Account > Cloudflare Pages > Read
#     - Zone > Cache Purge > Purge

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub Actions if: içinde secrets.NAME kullanılamaz.
  # Secret'ları önce env'e mapleyip if içinde env'e bakarız.
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
  CF_ZONE_ID_INVESTLIQ: ${{ secrets.CF_ZONE_ID_INVESTLIQ }}
  CF_ZONE_ID_HANEFINANS: ${{ secrets.CF_ZONE_ID_HANEFINANS }}

jobs:
  purge:
    name: Wait for deploy then purge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Wait 90s (CF Pages deploy başlaması için)
        run: sleep 90

      - name: Poll CF Pages until deploy is live (max 8 dk)
        id: wait_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_PAGES_PROJECT" ]; then
            echo "::warning::CF_API_TOKEN / CF_ACCOUNT_ID / CF_PAGES_PROJECT eksik — polling skip, direkt purge deneyeceğiz"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting for CF Pages deploy of commit: $COMMIT_SHA"
          for i in $(seq 1 32); do
            RESP=$(curl -s \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT/deployments?per_page=10")

            STATUS=$(echo "$RESP" | grep -oE '"latest_stage":\{"name":"deploy","status":"[^"]+"' | head -1 | grep -oE '"status":"[^"]+"' | grep -oE '[a-z]+"' | tr -d '"')

            echo "Attempt $i/32 — status: $STATUS"
            if [ "$STATUS" = "success" ]; then
              echo "✓ Deploy is live"
              echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$STATUS" = "failure" ] || [ "$STATUS" = "canceled" ]; then
              echo "✗ Deploy failed/canceled — purge iptal"
              exit 1
            fi

            sleep 15
          done

      - name: Ek 15s güvenlik payı (edge propagation)
        run: sleep 15

      - name: Purge investliq.com
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID_INVESTLIQ" ]; then
            echo "::warning::CF_API_TOKEN veya CF_ZONE_ID_INVESTLIQ eksik — purge skip"
            exit 0
          fi
          RESP=$(curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID_INVESTLIQ/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"success":true'; then
            echo "✓ investliq.com cache purged"
          else
            echo "✗ Purge failed for investliq.com"
            exit 1
          fi

      - name: Purge hanefinans.net (redirect zone)
        continue-on-error: true
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID_HANEFINANS" ]; then
            echo "hanefinans zone yok/eksik — skip"
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID_HANEFINANS/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            && echo "✓ hanefinans.net cache purged"
