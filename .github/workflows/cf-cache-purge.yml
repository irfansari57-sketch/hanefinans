name: CF Cache Purge on Deploy

# Her push sonrası CF edge cache'ini güvenilir şekilde purge eder.
# Yaklaşım: CF Pages API'sini polling ile bekle → deploy hazır olunca purge.
# "Blind sleep" yerine gerçek deploy status kontrolü.
#
# Setup (bir kez):
#   1. https://dash.cloudflare.com/profile/api-tokens → Create Token
#   2. Custom token permissions:
#      - Account > Cloudflare Pages > Read (deploy status için)
#      - Zone > Cache Purge > Purge (cache temizlemek için)
#   3. Zone Resources: investliq.com + hanefinans.net
#   4. GitHub Secrets:
#      - CF_API_TOKEN
#      - CF_ACCOUNT_ID (dash.cloudflare.com URL'sinden: /<ACCOUNT_ID>/pages)
#      - CF_PAGES_PROJECT (proje adı: hanefinans)
#      - CF_ZONE_ID_INVESTLIQ
#      - CF_ZONE_ID_HANEFINANS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  purge:
    name: Wait for deploy then purge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Wait 90s (CF Pages deploy başlaması için)
        run: sleep 90

      - name: Poll CF Pages until deploy is live (max 8 dk)
        id: wait_deploy
        if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != '' && secrets.CF_PAGES_PROJECT != '' }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          echo "Waiting for CF Pages deploy of commit: $COMMIT_SHA"

          for i in $(seq 1 32); do
            RESP=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${{ secrets.CF_PAGES_PROJECT }}/deployments?per_page=10")

            # Aynı commit için Success statüs var mı?
            MATCH=$(echo "$RESP" | grep -oE "\"deployment_trigger\":\{[^}]*\"commit_hash\":\"${COMMIT_SHA:0:8}[^\"]*\"[^}]*\}" | head -1)
            STATUS=$(echo "$RESP" | grep -oE '"latest_stage":\{"name":"deploy","status":"[^"]+"' | head -1 | grep -oE '"status":"[^"]+"' | grep -oE '[a-z]+"' | tr -d '"')

            echo "Attempt $i/32 — status: $STATUS"
            if [ "$STATUS" = "success" ]; then
              echo "✓ Deploy is live"
              echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$STATUS" = "failure" ] || [ "$STATUS" = "canceled" ]; then
              echo "✗ Deploy failed/canceled — purge yapmıyoruz"
              echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            sleep 15
          done

      - name: Ek 15s güvenlik payı (edge propagation)
        if: ${{ steps.wait_deploy.outputs.deploy_ready == 'true' || secrets.CF_ACCOUNT_ID == '' }}
        run: sleep 15

      - name: Purge investliq.com
        if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ZONE_ID_INVESTLIQ != '' }}
        run: |
          RESP=$(curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID_INVESTLIQ }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"success":true'; then
            echo "✓ investliq.com cache purged"
          else
            echo "✗ Purge failed for investliq.com"
            exit 1
          fi

      - name: Purge hanefinans.net (redirect zone)
        if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ZONE_ID_HANEFINANS != '' }}
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID_HANEFINANS }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            && echo "✓ hanefinans.net cache purged"

      - name: Warn if secrets missing
        if: ${{ secrets.CF_API_TOKEN == '' || secrets.CF_ZONE_ID_INVESTLIQ == '' }}
        run: |
          echo "::warning::Purge secret'ları eksik. CF_API_TOKEN + CF_ZONE_ID_INVESTLIQ set edilmemiş."
