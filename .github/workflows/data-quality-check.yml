name: Data Quality Health Check

# InvestLiq veri akışı sağlık kontrolü.
# Sabah 09:30, öğlen 12:30, akşam 15:30 (Istanbul TZ = UTC+3 → cron UTC 06:30 / 09:30 / 12:30)
# BIST açık saatlerde /api/health/data-quality endpoint'ini çağırır, fail durumunda
# GitHub Issue oluşturur (opsiyonel: Telegram webhook eklenebilir).

on:
  schedule:
    # UTC saatleri — TR saati +3
    - cron: '30 6 * * 1-5'    # 09:30 TR (Pzt-Cum) — piyasa öncesi
    - cron: '30 9 * * 1-5'    # 12:30 TR — öğle
    - cron: '30 12 * * 1-5'   # 15:30 TR — kapanış öncesi
  workflow_dispatch:            # elle tetiklenebilir

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint çağrısı
        id: check
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" https://investliq.com/api/health/data-quality)
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Status: $STATUS"
          echo "Response:"
          echo "$BODY" | jq . || echo "$BODY"

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Health check FAILED — HTTP $STATUS"
            exit 1
          fi

          OK=$(echo "$BODY" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "::error::Health check reported ok=false"
            exit 1
          fi

          echo "✅ All data feeds healthy"

      - name: Fail durumunda GitHub Issue oluştur
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString();
            const title = `⚠️ Data Quality Alert — ${now.slice(0, 16)}`;
            const body = `Otomatik data quality health check FAILED.

            **Zaman:** ${now}
            **Endpoint:** https://investliq.com/api/health/data-quality
            **HTTP Status:** ${{ steps.check.outputs.status }}

            \`\`\`json
            ${{ steps.check.outputs.body }}
            \`\`\`

            **Kontrol edilecekler:**
            - Yahoo Finance API erişilebilir mi?
            - TEFAS feed güncel mi (max 4 gün eski)?
            - BIST snapshot endpoint yanıt veriyor mu?
            - Kripto (CoinGecko) API çalışıyor mu?
            - Haber RSS kaynakları veri döndürüyor mu?

            Detay: Admin > Data Quality Dashboard (/admin/data-quality)
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'data-quality', 'urgent'],
            });

      # Opsiyonel: Telegram alert (TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secret'ları eklenirse)
      - name: Telegram alert (opsiyonel)
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ InvestLiq Data Quality Alert%0AHTTP ${{ steps.check.outputs.status }}%0A${{ steps.check.outputs.body }}"
