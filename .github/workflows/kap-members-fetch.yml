name: KAP Sirket Listesi (mkkMemberOid) Fetch

# BIST şirketleri → hisse kodu ↔ KAP mkkMemberOid (hisse bazlı KAP bildirimleri için). Haftada bir Pazar 04:10 UTC + elle.
on:
  schedule:
    - cron: '10 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi requests
      - name: Fetch KAP members
        run: python -u scripts/kap_members_fetch.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data/kap-members.json
          if git diff --staged --quiet; then echo "Degisiklik yok"; else
            git commit -m "data: KAP sirket oid listesi $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do if git push; then exit 0; fi; git pull --rebase --autostash origin main || true; sleep 3; done; exit 1
          fi
      - name: Purge jsDelivr cache
        if: always()
        run: curl -s --max-time 20 "https://purge.jsdelivr.net/gh/irfansari57-sketch/hanefinans@main/data/kap-members.json" | head -c 200; echo
