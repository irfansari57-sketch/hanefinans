name: Katilim Index Fetch
# BIST Katılım endeksi üyeliklerini açık kaynaklardan (katilimendeksi.org → borsaistanbul.com → KAP)
# çekip data/katilim.json'a yazar. /api/bist/katilim bu dosyayı jsDelivr'dan sunar.
# FVT kaynağı kapandı (22 Eki 2026). Bileşim çeyreklik değişir → haftada bir yeter.

on:
  schedule:
    - cron: '0 5 * * 1'   # Pazartesi 05:00 UTC (08:00 TR)
  workflow_dispatch:
  push:
    paths:
      - 'scripts/katilim_fetch.py'
      - '.github/workflows/katilim-fetch.yml'

permissions:
  contents: write       # data/katilim.json commit için

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "requests>=2.31.0" "curl_cffi>=0.7.0" "openpyxl>=3.1.0"

      # Script hiçbir kaynaktan ≥50 sembol alamazsa dosyayı değiştirmez ve exit 1 verir.
      # Job kırmızı görünsün (uyarı), ama commit adımı yine de çalışsın (değişiklik yoksa atlar).
      - name: Fetch katilim index members
        id: fetch
        continue-on-error: true
        run: python -u scripts/katilim_fetch.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data/katilim.json || true
          if git diff --staged --quiet; then
            echo "Katılım verisinde değişiklik yok, commit atlanıyor"
          else
            git commit -m "data: Katılım endeksi otomatik güncelleme $(date -u +%Y-%m-%d_%H:%M) [skip ci]"
            # Push race condition fix — 3 retry + rebase
            for i in 1 2 3; do
              if git push; then
                echo "✅ data/katilim.json commit'lendi ve push edildi (deneme $i)"
                exit 0
              fi
              echo "⚠️ Push reddedildi (deneme $i), pull --rebase + retry..."
              git pull --rebase --autostash origin main || true
              sleep 3
            done
            echo "❌ 3 denemeden sonra push hala başarısız"
            exit 1
          fi

      - name: Fail if no source worked
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::katilim_fetch.py hiçbir kaynaktan veri alamadı — log'daki [katilim] satırlarına bakın"
          exit 1
