name: Refresh Metals Spot

# XAU/XAG/XPT/XPD spot USD/ons fiyatlarini Yahoo'dan cekip D1'e yaz.
# Hafta ici her 30dk (piyasa acik + prev close bug'lari icin sik refresh),
# hafta sonu 2 saatte bir (Yahoo Cuma close'u tekrar dondurur; refresh'e
# gerek yok ama guvenlik icin).
on:
  schedule:
    # */30 * * * 1-5 = Pzt-Cum her 30dk (UTC — TR saatiyle 03:00-24:00 arasi
    # her 30dk; BIST/COMEX acikligini yakalamak icin genis pencere).
    - cron: '*/30 * * * 1-5'
    # 0 */2 * * 6,0 = Cts+Paz her 2 saatte bir (hafta sonu bakim seviyesinde
    # yeterli — Yahoo hafta sonu ayni degeri dondurur).
    - cron: '0 */2 * * 6,0'
  workflow_dispatch:
    # Manuel tetikleme (debug/test icin)

permissions:
  contents: read

jobs:
  refresh-metals:
    runs-on: ubuntu-latest
    steps:
      - name: Call metals-refresh endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret not set in repo settings — abort"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Accept: application/json" \
            "https://investliq.com/api/cron/metals-refresh")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body" | head -50
          # 200 = en az 1 metal basarili, 502 = hepsi basarisiz.
          # Cron re-run bir sonraki tetiklemede zaten olacak — sadece log.
          if [ "$code" -eq 502 ]; then
            echo "::warning::All metals failed to fetch — next cron will retry"
          fi
