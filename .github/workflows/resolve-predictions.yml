name: Resolve Daily Predictions

# Her gün BIST kapanışından sonra (18:30 TR = 15:30 UTC) tahminleri çözümle
on:
  schedule:
    - cron: '30 15 * * 1-5'  # Pzt-Cuma 15:30 UTC = 18:30 TR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger resolve endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "https://hanefinans.net/api/cron/resolve-predictions")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          [ "$code" -eq 200 ] || exit 1
