name: Signal Ledger (kanıt defteri)

# Sinyal motorunun ürettiği sinyalleri signal_ledger'a kaydeder ve 5/20/60 işlem
# günü ileri getirilerini doldurur (/api/cron/signal-ledger). bars-warm (16:40 UTC)
# bitiminden 30 dk sonra → 17:10 UTC (20:10 TR), hafta içi.
# Tablo: functions/migrations/022_signal_ledger.sql (yoksa endpoint 503 + hint → job fail).

on:
  schedule:
    - cron: '10 17 * * 1-5'
  workflow_dispatch:
    inputs:
      scope:
        description: 'bist100 | all (bars_meta tüm semboller)'
        default: 'bist100'

permissions:
  contents: read

concurrency:
  group: signal-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call signal-ledger endpoint
        id: run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCOPE: ${{ github.event.inputs.scope || 'bist100' }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET secret yok"; exit 1; fi
          resp=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Accept: application/json" \
            --max-time 280 \
            "https://investliq.com/api/cron/signal-ledger?scope=${SCOPE}")
          body=$(echo "$resp" | head -n -1); code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code"; echo "$body" | head -c 1200; echo
          echo "summary=HTTP $code $(echo "$body" | head -c 300)" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 200 ]; then echo "::error::signal-ledger HTTP $code"; exit 1; fi
          if ! echo "$body" | grep -q '"ok":true'; then echo "::error::signal-ledger ok:false"; exit 1; fi
          ins=$(echo "$body" | grep -o '"inserted":[0-9]*' | head -1 | cut -d: -f2)
          fil=$(echo "$body" | grep -o '"filled":[0-9]*' | head -1 | cut -d: -f2)
          echo "::notice::signal-ledger: inserted=${ins:-0} filled=${fil:-0}"

      - name: Telegram alarm (hata)
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          msg="🚨 InvestliQ signal-ledger BAŞARISIZ%0A${{ steps.run.outputs.summary }}%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${msg}" > /dev/null || true
