name: TEFAS Fund Fetch
# TEFAS'tan tüm fonların güncel NAV + dönemsel getirilerini çekip data/tefas.json'a yazar.
# tefas-crawler paketi (burhanyldzz/tefas-crawler) — TEFAS ASP.NET session ile çalışır.

on:
  schedule:
    # Günde 4 kez (saat 06:00, 12:00, 18:00, 00:00 TR — UTC -3) — Cloudflare Pages free
    # tier'da ayda max 500 build limitine takılmamak için seyrek tutuldu.
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:    # Actions'tan manuel tetikleme
  push:
    paths:
      - 'scripts/tefas_fetch.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/tefas-fetch.yml'

permissions:
  contents: write       # data/tefas.json commit için

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch TEFAS data
        run: python -u scripts/tefas_fetch.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data/tefas.json
          if git diff --staged --quiet; then
            echo "TEFAS verisinde değişiklik yok, commit atlanıyor"
          else
            git commit -m "data: TEFAS otomatik güncelleme $(date -u +%Y-%m-%d_%H:%M) [skip ci]"
            # Push race condition fix — 3 retry + rebase
            for i in 1 2 3; do
              if git push; then
                echo "✅ data/tefas.json commit'lendi ve push edildi (deneme $i)"
                exit 0
              fi
              echo "⚠️ Push reddedildi (deneme $i), pull --rebase + retry..."
              git pull --rebase --autostash origin main || true
              sleep 3
            done
            echo "❌ 3 denemeden sonra push hala başarısız"
            exit 1
          fi
