name: TEFAS Fund Fetch
# TEFAS'tan tüm fonların güncel NAV ve dönemsel getirilerini çekip data/tefas.json'a yazar.
# Saatlik çalışır (TEFAS verisi gün sonu güncellenir ama biz güne yakın kalalım).

on:
  # Schedule şimdilik iptal — TEFAS API'si GitHub Actions IP'lerinde
  # yavaş çalışıyor / rate-limit yiyor. Manuel tetikleme korundu.
  workflow_dispatch:

permissions:
  contents: write              # data/tefas.json commit için

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip list

      - name: Fetch TEFAS data
        run: python -u scripts/tefas_fetch.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/tefas.json 2>/dev/null; then
            echo "TEFAS verisinde değişiklik yok, commit atlanıyor"
          else
            git add data/tefas.json
            git commit -m "chore: TEFAS verisi güncellendi $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
