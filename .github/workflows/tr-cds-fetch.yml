name: TR CDS Fetch
# worldgovernmentbonds.com TR 5Y CDS spread + history (JS-rendered)
# Playwright headless Chromium ile render edip data/tr-cds.json'a yazar.
# Static scrape başarısız çünkü site SPA-tarzı JS render kullanıyor.

on:
  schedule:
    # 2x/gün: 04:00 ve 16:00 UTC (07:00 ve 19:00 TR — sabah + akşam piyasa)
    - cron: '0 4,16 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape_tr_cds.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/tr-cds-fetch.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright>=1.40.0
          playwright install --with-deps chromium

      - name: Run TR CDS scraper
        run: python -u scripts/scrape_tr_cds.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tr-cds.json
          # Debug HTML varsa onu da artifact olarak ekle
          if [ -f data/tr-cds-debug.html ]; then
            git add data/tr-cds-debug.html
          fi
          if git diff --staged --quiet; then
            echo "TR CDS verisinde değişiklik yok, commit atlanıyor"
          else
            # [skip ci] → Cloudflare Pages rebuild tetiklemesin (jsDelivr CDN'den okunuyor)
            git commit -m "data: TR CDS otomatik güncelleme $(date -u +%Y-%m-%d_%H:%M) [skip ci]"
            git push
            echo "✅ data/tr-cds.json commit'lendi ve push edildi"
          fi

      - name: Upload debug HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tr-cds-debug-html
          path: data/tr-cds-debug.html
          retention-days: 7
