name = "hane-finans-yahoo-warmer"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Cron schedules — Cloudflare Free plan'da worker başına max 5 cron trigger
# TR borsa saatleri TR = UTC+3 (DST yok), BIST açık: 10:00-18:00 TR = 07:00-15:00 UTC, Mon-Fri
# - BIST quotes: her 10 dk, BIST açık, Mon-Fri (chunk rotasyonu)
# - BIST historical (top 200): günde 1 kez akşam 18:30 TR = 15:30 UTC (yeterli, 24 saat cache)
# - Spot metals (Stooq XAU/XAG/XPT): her 3 dk, 7/24
# - Crypto (BTC/ETH/XRP/DOGE): her 5 dk, 7/24
# - Cleanup: ayrı cron'a gerek yok — quote tetiklerinde rastgele 1/100 ihtimalle çalıştırılır
[triggers]
crons = [
  "*/10 7-15 * * 1-5",
  "30 15 * * 1-5",
  "*/3 * * * *",
  "*/5 * * * *",
]

[[d1_databases]]
binding = "DB"
database_name = "hanefinans-db"
database_id = "356a17bf-317f-45e5-9f6e-236b0b9db6a5"

[observability]
enabled = true

[build]
command = ""
