<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- White rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="url(#bg)" filter="url(#softShadow)"/>

  <!-- 5 bars: short, medium, tall (highest middle), tall, short -->
  <g filter="url(#softShadow)">
    <rect x="105" y="278" width="48" height="120" rx="6" fill="url(#bar)"/>
    <rect x="170" y="228" width="48" height="170" rx="6" fill="url(#bar)"/>
    <rect x="235" y="148" width="48" height="250" rx="6" fill="url(#bar)"/>
    <rect x="300" y="198" width="48" height="200" rx="6" fill="url(#bar)"/>
    <rect x="365" y="258" width="48" height="140" rx="6" fill="url(#bar)"/>
  </g>

  <!-- Shine overlay on bars -->
  <g opacity="0.6">
    <rect x="105" y="278" width="14" height="120" rx="6" fill="url(#shine)"/>
    <rect x="170" y="228" width="14" height="170" rx="6" fill="url(#shine)"/>
    <rect x="235" y="148" width="14" height="250" rx="6" fill="url(#shine)"/>
    <rect x="300" y="198" width="14" height="200" rx="6" fill="url(#shine)"/>
    <rect x="365" y="258" width="14" height="140" rx="6" fill="url(#shine)"/>
  </g>

  <!-- Dotted wave under bars (price tick pattern) -->
  <g fill="#22d3ee">
    <circle cx="100"  cy="412" r="3.5"/>
    <circle cx="120"  cy="416" r="3.5"/>
    <circle cx="140"  cy="418" r="3.5"/>
    <circle cx="160"  cy="416" r="3.5"/>
    <circle cx="180"  cy="412" r="3.5"/>
    <circle cx="200"  cy="408" r="3.5"/>
    <circle cx="220"  cy="406" r="3.5"/>
    <circle cx="240"  cy="408" r="3.5"/>
    <circle cx="260"  cy="412" r="3.5"/>
    <circle cx="280"  cy="416" r="3.5"/>
    <circle cx="300"  cy="418" r="3.5"/>
    <circle cx="320"  cy="416" r="3.5"/>
    <circle cx="340"  cy="412" r="3.5"/>
    <circle cx="360"  cy="408" r="3.5"/>
    <circle cx="380"  cy="406" r="3.5"/>
    <circle cx="400"  cy="408" r="3.5"/>
    <circle cx="420"  cy="412" r="3.5"/>
  </g>
</svg>
