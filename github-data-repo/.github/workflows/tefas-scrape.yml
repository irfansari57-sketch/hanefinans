name: TEFAS Scrape

on:
  schedule:
    # Sadece haftaiçi (Pzt-Cum) çalış — UTC saatleri.
    # TEFAS Türkiye'de hafta sonu NAV yayınlamaz; Cumartesi/Pazar koşmak boşa Action
    # quota harcar, üstüne updatedAt'i gereksiz yeniler. Cuma 18:30 (TR) kapanış ile
    # son snapshot dondurulur; Pazartesi 06:00 (TR) ile yeniden başlar.
    # Cron: dakika 5'te her saat, Pzt-Cum, UTC 03:00 - 19:00 (TR 06:00 - 22:00).
    - cron: '5 3-19 * * 1-5'
  workflow_dispatch:  # Actions sekmesinde "Run workflow" ile manuel tetik
  push:
    branches: [main]  # main'e her commit'te de çalış (test için)

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Scrape TEFAS
        run: python scripts/scrape-tefas.py
        env:
          TZ: Europe/Istanbul

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: TEFAS auto-update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
