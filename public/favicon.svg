<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="0.2" stop-color="#4ade80"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="frs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="0.4" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="fmg" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#052e16" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="fg" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <circle cx="27" cy="27" r="24" fill="url(#fg)"/>

  <!-- Dış Q ring -->
  <circle cx="27" cy="27" r="17" fill="none" stroke="url(#fr)" stroke-width="6"/>
  <circle cx="27" cy="27" r="17" fill="none" stroke="url(#frs)" stroke-width="6"/>

  <!-- Q dış kuyruk -->
  <line x1="39" y1="39" x2="52" y2="52" stroke="url(#fr)" stroke-width="6" stroke-linecap="round"/>
  <line x1="39" y1="39" x2="52" y2="52" stroke="url(#frs)" stroke-width="6" stroke-linecap="round"/>

  <!-- Q iç kuyruk göstergesi -->
  <line x1="36" y1="36" x2="32" y2="32" stroke="url(#fm)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mini büyüteç -->
  <circle cx="25" cy="25" r="7" fill="url(#fmg)"/>
  <circle cx="25" cy="25" r="7" fill="none" stroke="url(#fm)" stroke-width="2.5"/>
  <line x1="30" y1="30" x2="34" y2="34" stroke="url(#fm)" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="22" cy="22" rx="1.6" ry="1" fill="#ffffff" opacity="0.7" transform="rotate(-35 22 22)"/>
</svg>
