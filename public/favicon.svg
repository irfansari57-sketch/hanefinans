<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- InvestliQ favicon v7 - F3 Ring outline: koyu zemin + yesil border + kalin Q -->
  <defs>
    <linearGradient id="q-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ring-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Koyu yesil zemin, yumusak koseli -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#052e16"/>
  <!-- Yesil ring border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#ring-fill)" stroke-width="4"/>
  <!-- Kalin Q harfi -->
  <text x="32" y="46" text-anchor="middle"
        font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="46"
        letter-spacing="-2"
        fill="url(#q-fill)">Q</text>
</svg>
