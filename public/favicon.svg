<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- InvestliQ favicon v8 - G1 Aurora Glass: emerald zemin + cyan/emerald aurora + cam-parlak Q -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3d2c"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="30%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="72%" cy="82%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="q-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="55%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#aurora1)"/>
    <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#aurora2)"/>
  </g>
  <text x="32" y="47" text-anchor="middle"
        font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="48"
        letter-spacing="-3"
        fill="url(#q-glass)">Q</text>
</svg>
