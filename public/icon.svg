<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="45%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#132242"/>
      <stop offset="55%" stop-color="#0e1830"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </radialGradient>
    <radialGradient id="amber" cx="46%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="0.18" stop-color="#4ade80"/>
      <stop offset="0.45" stop-color="#16a34a"/>
      <stop offset="0.78" stop-color="#14532d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="ringShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052e16" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#052e16" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot3d" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="0.25" stop-color="#86efac"/>
      <stop offset="0.6" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="dotShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="2" dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background — site-benzeri radial navy -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Ambient emerald hale -->
  <circle cx="235" cy="230" r="256" fill="url(#amber)"/>

  <!-- Sparkle yıldızları — daha görünür -->
  <g filter="url(#sparkle)">
    <circle cx="68" cy="102" r="10" fill="#4ade80" opacity="0.9"/>
    <circle cx="435" cy="76" r="8" fill="#86efac" opacity="0.8"/>
    <circle cx="51" cy="350" r="8.5" fill="#4ade80" opacity="0.75"/>
    <circle cx="452" cy="418" r="11" fill="#86efac" opacity="0.85"/>
    <circle cx="400" cy="51" r="6" fill="#ffffff" opacity="0.78"/>
    <circle cx="102" cy="443" r="6.5" fill="#ffffff" opacity="0.72"/>
    <circle cx="26" cy="222" r="6" fill="#22c55e" opacity="0.68"/>
    <circle cx="486" cy="256" r="7" fill="#22c55e" opacity="0.72"/>
  </g>
  <!-- Spike stars -->
  <g fill="#ffffff" opacity="0.75">
    <path d="M94 94 L98 76 L102 94 L120 98 L102 102 L98 120 L94 102 L76 98 Z"/>
    <path d="M426 426 L430 408 L434 426 L452 430 L434 434 L430 452 L426 434 L408 430 Z"/>
  </g>

  <!-- Q halkası — chrome 3D -->
  <g filter="url(#outerGlow)">
    <circle cx="235" cy="235" r="145" fill="none" stroke="url(#ring3d)" stroke-width="52"/>
    <circle cx="235" cy="235" r="145" fill="none" stroke="url(#ringShine)" stroke-width="52"/>
    <circle cx="235" cy="235" r="145" fill="none" stroke="url(#ringInner)" stroke-width="52" transform="rotate(180 235 235)"/>
  </g>

  <!-- Q kuyruğu -->
  <g filter="url(#outerGlow)">
    <line x1="329" y1="329" x2="435" y2="435" stroke="url(#ring3d)" stroke-width="52" stroke-linecap="round"/>
    <line x1="329" y1="329" x2="435" y2="435" stroke="url(#ringShine)" stroke-width="52" stroke-linecap="round"/>
  </g>

  <!-- i noktası glow -->
  <circle cx="235" cy="235" r="60" fill="url(#dotGlow)"/>

  <!-- i noktası — 3D emerald sphere -->
  <g filter="url(#dotShadow)">
    <circle cx="235" cy="235" r="36" fill="url(#dot3d)" stroke="#86efac" stroke-width="2.5"/>
    <ellipse cx="224" cy="222" rx="15" ry="9.5" fill="#ffffff" opacity="0.78" transform="rotate(-35 224 222)"/>
    <circle cx="230" cy="226" r="3.5" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
