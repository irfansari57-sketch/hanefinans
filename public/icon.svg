<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- InvestliQ PWA/Apple icon v7 - F3 Ring outline stili -->
  <defs>
    <linearGradient id="q-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ring-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#052e16" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c1a" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- Koyu yesil zemin, iOS/PWA icin buyuk rounded corner -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#052e16"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#ambient)"/>
  <!-- Kalin yesil ring border, ic taraftan cizilmis -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#ring-fill)" stroke-width="28"/>
  <!-- Buyuk gradient Q harfi, merkeze hizali -->
  <text x="256" y="372" text-anchor="middle"
        font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="360"
        letter-spacing="-16"
        fill="url(#q-fill)">Q</text>
</svg>
