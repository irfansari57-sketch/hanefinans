<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="amber" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.35" stop-color="#22c55e"/>
      <stop offset="0.75" stop-color="#15803d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="ringShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diamond3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.4" stop-color="#4ade80"/>
      <stop offset="0.72" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="diamondShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="diamondShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark rounded square canvas -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- Emerald ambient hale -->
  <circle cx="234" cy="234" r="240" fill="url(#amber)"/>

  <!-- Sparkle stars -->
  <g filter="url(#sparkle)">
    <circle cx="76" cy="112" r="7" fill="#4ade80" opacity="0.72"/>
    <circle cx="428" cy="86" r="5.5" fill="#86efac" opacity="0.62"/>
    <circle cx="60" cy="340" r="6" fill="#4ade80" opacity="0.58"/>
    <circle cx="444" cy="410" r="7" fill="#86efac" opacity="0.68"/>
    <circle cx="392" cy="60" r="4" fill="#ffffff" opacity="0.55"/>
    <circle cx="112" cy="436" r="4" fill="#ffffff" opacity="0.55"/>
    <circle cx="34" cy="234" r="4" fill="#22c55e" opacity="0.5"/>
    <circle cx="476" cy="234" r="4.5" fill="#22c55e" opacity="0.55"/>
  </g>

  <!-- Q ring 3D + outer glow -->
  <g filter="url(#outerGlow)">
    <circle cx="234" cy="234" r="145" fill="none" stroke="url(#ring3d)" stroke-width="43"/>
    <circle cx="234" cy="234" r="145" fill="none" stroke="url(#ringShine)" stroke-width="43"/>
  </g>

  <!-- Inner emerald accent halka -->
  <circle cx="234" cy="234" r="124" fill="none" stroke="#4ade80" stroke-width="3" opacity="0.55"/>

  <!-- Magnifier sap (Q'nun kuyruğu) -->
  <g filter="url(#outerGlow)">
    <line x1="324" y1="324" x2="420" y2="420" stroke="url(#ring3d)" stroke-width="43" stroke-linecap="round"/>
    <line x1="324" y1="324" x2="420" y2="420" stroke="url(#ringShine)" stroke-width="43" stroke-linecap="round"/>
  </g>

  <!-- Green diamond center -->
  <g filter="url(#diamondShadow)">
    <polygon points="234,154 290,234 234,314 178,234" fill="url(#diamond3d)" stroke="#86efac" stroke-width="3"/>
    <polygon points="234,154 260,192 234,234 208,192" fill="url(#diamondShine)"/>
    <circle cx="234" cy="234" r="6" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
