<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- InvestliQ PWA/Apple icon v8 - G1 Aurora Glass -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3d2c"/>
      <stop offset="55%" stop-color="#083827"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="30%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="72%" cy="82%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="15%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="q-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="q-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="q-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ana zemin (iOS/PWA uyumlu buyuk radius) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Aurora blur katmanlari -->
  <g filter="url(#blur)">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aurora1)"/>
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aurora2)"/>
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aurora3)"/>
  </g>
  <!-- Ust cam parlamasi -->
  <rect x="0" y="0" width="512" height="256" rx="112" fill="url(#q-shine)" opacity="0.35"/>
  <!-- Cam-parlak Q harfi, merkeze buyuk -->
  <text x="256" y="378" text-anchor="middle"
        font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="380"
        letter-spacing="-18"
        fill="url(#q-glass)"
        filter="url(#q-shadow)">Q</text>
  <!-- Q harfi uzerine hafif ust parlama -->
  <text x="256" y="378" text-anchor="middle"
        font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-weight="900" font-size="380"
        letter-spacing="-18"
        fill="url(#q-shine)"
        opacity="0.6">Q</text>
</svg>
