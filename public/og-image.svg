<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Deep dark navy → emerald hint background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="60%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0f1f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald 3D diamond gradients -->
    <linearGradient id="diamondFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="diamondShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>

    <!-- Chart line gradient (emerald upward trend) -->
    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#10b981" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Faint chart line background right side -->
  <g opacity="0.45">
    <path d="M 620 480 L 700 460 L 770 470 L 830 420 L 890 440 L 950 380 L 1020 400 L 1080 340 L 1140 360"
          stroke="url(#chartLine)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 620 480 L 700 460 L 770 470 L 830 420 L 890 440 L 950 380 L 1020 400 L 1080 340 L 1140 360 L 1140 560 L 620 560 Z"
          fill="url(#chartFill)"/>
  </g>

  <!-- Logo: 3D emerald diamond with magnifier ring -->
  <g transform="translate(112, 92)">
    <!-- Magnifier chrome ring -->
    <circle cx="80" cy="80" r="80" fill="none" stroke="url(#chromeRing)" stroke-width="6"/>
    <circle cx="80" cy="80" r="76" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Magnifier handle -->
    <rect x="140" y="140" width="60" height="14" rx="7"
          fill="url(#chromeRing)" transform="rotate(45, 140, 140)"/>
    <!-- Inner black bezel -->
    <circle cx="80" cy="80" r="70" fill="#050a10"/>
    <!-- 3D emerald diamond -->
    <g transform="translate(80,80)">
      <polygon points="0,-42 32,-4 0,42 -32,-4" fill="url(#diamondFace)"/>
      <polygon points="0,-42 32,-4 0,-8" fill="#ffffff" opacity="0.28"/>
      <polygon points="0,-42 -32,-4 0,-8" fill="#000000" opacity="0.15"/>
      <!-- Sparkle -->
      <circle cx="-10" cy="-18" r="3" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Brand name: InvestliQ -->
  <text x="310" y="180" fill="#f1f5f9" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="96" font-weight="800" letter-spacing="-2">
    <tspan fill="#f1f5f9">Invest</tspan><tspan fill="#22c55e">liQ</tspan>
  </text>

  <!-- Tagline -->
  <text x="310" y="228" fill="#94a3b8" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="500" letter-spacing="0">
    Yatırımcılar İçin Akıllı Veri Platformu
  </text>

  <!-- Main headline -->
  <text x="112" y="360" fill="#f8fafc" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1">
    Veri · Analiz · Fırsat
  </text>

  <!-- Subline -->
  <text x="112" y="410" fill="#cbd5e1" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="24" font-weight="400">
    BIST hisseleri, TEFAS fonları, kripto, döviz ve makro
  </text>
  <text x="112" y="442" fill="#cbd5e1" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="24" font-weight="400">
    göstergeler için canlı fiyat ve günlük yorum.
  </text>

  <!-- Category pills -->
  <g font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(112, 502)">
      <rect x="0" y="0" width="120" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="60" y="30" fill="#34d399" text-anchor="middle">BIST 100</text>
    </g>
    <g transform="translate(244, 502)">
      <rect x="0" y="0" width="110" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="55" y="30" fill="#34d399" text-anchor="middle">TEFAS</text>
    </g>
    <g transform="translate(366, 502)">
      <rect x="0" y="0" width="120" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="60" y="30" fill="#34d399" text-anchor="middle">Kripto</text>
    </g>
    <g transform="translate(498, 502)">
      <rect x="0" y="0" width="110" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="55" y="30" fill="#34d399" text-anchor="middle">Döviz</text>
    </g>
    <g transform="translate(620, 502)">
      <rect x="0" y="0" width="100" height="44" rx="22" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="50" y="30" fill="#fbbf24" text-anchor="middle">AI</text>
    </g>
  </g>

  <!-- URL bottom right -->
  <text x="1088" y="590" fill="#64748b" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="500" text-anchor="end">
    investliq.com
  </text>
</svg>
