<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient — premium dark with accent glow -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="accentGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="numberText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#accentGlow)" />

  <!-- Subtle grid pattern -->
  <g stroke="rgba(148, 163, 184, 0.08)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand left bar -->
  <rect x="80" y="180" width="8" height="220" rx="4" fill="url(#accentBar)" />

  <!-- Title -->
  <text x="120" y="240" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#f1f5f9" letter-spacing="-1">
    HANE FİNANS
  </text>
  <text x="120" y="285" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="3">
    FINANCIAL INTELLIGENCE
  </text>

  <!-- Subtitle / tagline -->
  <text x="120" y="360" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1">
    AI Destekli Finansal Analiz
  </text>
  <text x="120" y="402" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#64748b">
    BIST · TEFAS · Kripto · Döviz · Makro
  </text>

  <!-- Bottom accent indicators -->
  <g transform="translate(120, 470)">
    <!-- BIST chip -->
    <rect width="120" height="40" rx="8" fill="rgba(34, 211, 238, 0.12)" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1" />
    <text x="60" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="1">
      BIST 100
    </text>
    <!-- TEFAS chip -->
    <rect x="140" width="120" height="40" rx="8" fill="rgba(250, 204, 21, 0.12)" stroke="rgba(250, 204, 21, 0.3)" stroke-width="1" />
    <text x="200" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#facc15" letter-spacing="1">
      TEFAS
    </text>
    <!-- AI chip -->
    <rect x="280" width="100" height="40" rx="8" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
    <text x="330" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#a855f7" letter-spacing="1">
      AI
    </text>
  </g>

  <!-- Right side — abstract chart silhouette -->
  <g transform="translate(720, 200)" opacity="0.7">
    <!-- Trend up bars -->
    <rect x="0" y="180" width="20" height="40" rx="2" fill="#22d3ee" opacity="0.5" />
    <rect x="30" y="160" width="20" height="60" rx="2" fill="#22d3ee" opacity="0.6" />
    <rect x="60" y="120" width="20" height="100" rx="2" fill="#22d3ee" opacity="0.7" />
    <rect x="90" y="80" width="20" height="140" rx="2" fill="#22d3ee" opacity="0.8" />
    <rect x="120" y="100" width="20" height="120" rx="2" fill="#22d3ee" opacity="0.7" />
    <rect x="150" y="60" width="20" height="160" rx="2" fill="#10b981" opacity="0.9" />
    <rect x="180" y="40" width="20" height="180" rx="2" fill="#10b981" />
    <rect x="210" y="30" width="20" height="190" rx="2" fill="#10b981" />
    <!-- Trend line over -->
    <polyline
      points="10,200 40,180 70,140 100,90 130,110 160,70 190,50 220,40"
      stroke="#22d3ee"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Latest point glow -->
    <circle cx="220" cy="40" r="6" fill="#22d3ee" />
    <circle cx="220" cy="40" r="12" fill="#22d3ee" opacity="0.3" />
  </g>

  <!-- URL bottom right -->
  <text x="1120" y="585" text-anchor="end" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#64748b">
    hanefinans.net
  </text>
</svg>
