<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="50%" stop-color="#0e1830" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="accentGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="ring3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.35" stop-color="#22c55e"/>
      <stop offset="0.75" stop-color="#15803d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="ringShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diamond3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.4" stop-color="#4ade80"/>
      <stop offset="0.72" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="diamondShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#accentGlow)" />

  <!-- Subtle grid -->
  <g stroke="rgba(148, 163, 184, 0.08)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left brand accent bar -->
  <rect x="80" y="180" width="8" height="240" rx="4" fill="url(#accentBar)" />

  <!-- Title: InvestLiq -->
  <text x="120" y="240" font-family="Inter, sans-serif" font-size="72" font-weight="800" letter-spacing="-1">
    <tspan fill="#f1f5f9">Invest</tspan><tspan fill="#4ade80">Liq</tspan>
  </text>
  <text x="120" y="290" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#86efac" letter-spacing="4">
    AKILLI VERİ PLATFORMU
  </text>

  <!-- Tagline -->
  <text x="120" y="370" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1">
    Yatırımcılar İçin Akıllı Veri
  </text>
  <text x="120" y="412" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#64748b">
    BIST · TEFAS · Kripto · Döviz · Makro · AI
  </text>

  <!-- Bottom chip indicators -->
  <g transform="translate(120, 470)">
    <rect width="120" height="40" rx="8" fill="rgba(34, 197, 94, 0.14)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1" />
    <text x="60" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#4ade80" letter-spacing="1">
      BIST 100
    </text>
    <rect x="140" width="120" height="40" rx="8" fill="rgba(250, 204, 21, 0.12)" stroke="rgba(250, 204, 21, 0.3)" stroke-width="1" />
    <text x="200" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#facc15" letter-spacing="1">
      TEFAS
    </text>
    <rect x="280" width="100" height="40" rx="8" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
    <text x="330" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#a855f7" letter-spacing="1">
      AI
    </text>
  </g>

  <!-- Right side: Q logo büyük -->
  <g transform="translate(830, 155)">
    <!-- Q ring 3D + outer glow -->
    <g filter="url(#glow)">
      <circle cx="140" cy="140" r="105" fill="none" stroke="url(#ring3d)" stroke-width="30"/>
      <circle cx="140" cy="140" r="105" fill="none" stroke="url(#ringShine)" stroke-width="30"/>
    </g>
    <!-- Inner accent -->
    <circle cx="140" cy="140" r="89" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.55"/>
    <!-- Magnifier tail -->
    <g filter="url(#glow)">
      <line x1="205" y1="205" x2="270" y2="270" stroke="url(#ring3d)" stroke-width="30" stroke-linecap="round"/>
      <line x1="205" y1="205" x2="270" y2="270" stroke="url(#ringShine)" stroke-width="30" stroke-linecap="round"/>
    </g>
    <!-- Diamond center -->
    <polygon points="140,80 180,140 140,200 100,140" fill="url(#diamond3d)" stroke="#86efac" stroke-width="2"/>
    <polygon points="140,80 158,110 140,140 122,110" fill="url(#diamondShine)"/>
    <circle cx="140" cy="140" r="4" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- URL -->
  <text x="1120" y="585" text-anchor="end" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#64748b">
    investliq.com
  </text>
</svg>
